name: Dependabot auto-merge

# Aktiviert Auto-Merge für Dependabot-PRs. Der eigentliche Merge erfolgt erst,
# wenn alle in der Branch-Protection von `main` als "required" markierten
# Status-Checks (build, SonarCloud) erfolgreich sind.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'arburk/vscp-backend'
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
